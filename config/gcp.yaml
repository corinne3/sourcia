# Même code, modèle Gemini via LiteLLM (clé GEMINI_API_KEY dans .env, jamais dans le code).
# Prérequis : pip install -e ".[cloud]"
# ⚠️ Les documents PRIVÉS ne sont JAMAIS envoyés à ce modèle (verrou dans qualify/pipeline.py) : règles seules pour eux.
# ⚠️ Niveau gratuit : réservé aux essais ; un service ouvert à des utilisateurs de l'EEE doit passer au niveau payant.
name: gcp
# Gemini reformule davantage qu'un petit modèle et invente moins : contrôle un peu moins strict (09/11)
formation_threshold: 0.6
data_dir: data

llm:
  provider: litellm
  model: gemini/gemini-3.1-flash-lite
  temperature: 0.0
  max_tokens: 700
  timeout_s: 120

embedder:
  kind: sentence-transformers  # vecteurs calculés en local : 0 requête d'API pour l'index
  model: intfloat/multilingual-e5-small

search:
  dense_only_margin: 0.03     # e5 : sens seul gardé si sim ≥ meilleure − 0,03 (calibré à l'étape 6 ; à revoir sur un vrai corpus)
