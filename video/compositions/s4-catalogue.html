    const tl = gsap.timeline({ paused: true });

    ];
    const curseur = document.getElementById("s4-curseur");
    // position dans la mise en page (offsetLeft/Top) : ne dépend ni des transformations ni de l'ordre des images ;
    // aux instants visés, la page n'est pas déplacée (caméra au repos)
    function point(p) {
      if (!p.sel) return [p.x, p.y];
      let el = document.querySelector(p.sel), x = 0, y = 0;
      const w = el.offsetWidth, h = el.offsetHeight;
      while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
      return [x + w * 0.55, y + h * 0.55];
    }
    const ease = gsap.parseEase("power2.inOut");
    function placer(t) {
      let i = passages.findIndex((p) => p.t > t);
      if (i === -1) i = passages.length;
      const a = passages[Math.max(0, i - 1)], b = passages[Math.min(passages.length - 1, i)];
      const [ax, ay] = point(a), [bx, by] = point(b);
      const k = b.t === a.t ? 1 : ease(Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))));
      gsap.set(curseur, { x: ax + (bx - ax) * k, y: ay + (by - ay) * k });
    }
    const horloge = { t: 0 };

    // ---- « Ajouter » deux fois : le bouton devient l'étiquette

    tl.fromTo("#s4-d1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 4.25);
    clic(5.05);
    tl.to("#s4-b3", { opacity: 0, duration: 0.08 }, 5.1);
    tl.fromTo("#s4-d3", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 5.1);

    tl.fromTo("#s4-prive", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 7.02);
    tl.set("#s4-nf-b", { opacity: 0 }, 0);

    tl.set("#s4-surligne", { backgroundRepeat: "no-repeat" }, 0);
