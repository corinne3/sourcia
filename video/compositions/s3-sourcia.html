    pots.forEach((p, i) => {
      const t = 1.0 + i * 0.55;

      tl.fromTo([p + " .nom", p + " .aide"], { opacity: 0 }, { opacity: 1, duration: 0.18, stagger: 0.08 }, t + 0.2);
      if (i < 3) tl.fromTo("#s3-s" + (i + 1), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, t + 0.3);
    });
    // transition : on entre dans l'étape 1 par son pot (zoom à travers), sa couleur blanche devient le plan suivant
