# Vérification automatique à chaque push et à chaque PR : tous les tests, puis l'image Docker du serveur
# (construite et démarrée pour voir qu'elle répond ; elle n'est publiée nulle part).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:                      # un nouveau push annule la vérification en cours sur la même branche
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installer
        run: pip install -e ".[dev,api]"
      - name: Lancer les tests
        run: pytest -q

  docker:
    name: Image Docker du serveur
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: sourcia:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sans secret de session, le serveur refuse de démarrer
        run: |
          if docker run --rm sourcia:ci; then echo "Le serveur aurait dû refuser de démarrer"; exit 1; fi
      - name: Avec un secret, le serveur répond
        run: |
          docker run -d --name sourcia -p 8000:8000 -e SOURCIA_SESSION_SECRET="$(openssl rand -hex 32)" sourcia:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/etat; then echo; exit 0; fi
            sleep 2
          done
          docker logs sourcia
          exit 1
      - name: Aucun secret ni donnée dans l'image
        run: |
          docker run --rm --entrypoint sh sourcia:ci -c 'test ! -e /app/.env && test ! -e /app/data && test -z "$(ls -A /data)"'
